<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Store - متجر أيان لاشتراكات IPTV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131b2e; --accent-blue: #00d2ff; --accent-purple: #9d4edd; --text-color: #ffffff; --text-muted: #a0aec0; --whatsapp-color: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        header { text-align: center; padding: 40px 20px 20px; background: radial-gradient(circle at top, rgba(0, 210, 255, 0.15), transparent 70%); }
        .main-logo { width: 140px; height: 140px; object-fit: contain; border-radius: 50%; box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); margin-bottom: 15px; }
        .title-3d { font-size: 3.2rem; font-weight: 900; background: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .servers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 30px; }
        .server-card { background: var(--card-bg); border-radius: 20px; padding: 25px; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255, 255, 255, 0.08); }
        .server-logo { width: 110px; height: 110px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 3px solid rgba(255, 255, 255, 0.1); }
        .btn-whatsapp { width: 100%; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; padding: 12px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 700; margin-top: 15px; }
        .pricing-list { width: 100%; list-style: none; margin-bottom: 25px; }
        .price-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255, 255, 255, 0.03); margin-bottom: 5px; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <!-- هنا شعار المتجر -->
        <img src="svgviewer-png-output.png" alt="Ayan Store Logo" class="main-logo">
        <h1 class="title-3d">AYAN STORE</h1>
    </header>

    <div class="container">
        <div class="servers-grid">
            <!-- Server 1: AM LIVE -->
            <div class="server-card">
                <img src="IMG_142931_20260716.png" alt="AM LIVE" class="server-logo">
                <h3>AM LIVE</h3>
                <ul class="pricing-list">
                    <li class="price-item"><span>شهر واحد</span><span>5,000 د.ع</span></li>
                    <li class="price-item"><span>3 أشهر</span><span>10,000 د.ع</span></li>
                </ul>
                <a href="#" onclick="orderServer('AM LIVE')" class="btn-whatsapp">اطلب الآن</a>
            </div>

            <!-- Server 2: ONE 4K -->
            <div class="server-card">
                <img src="IMG_193200_20260813.jpg" alt="ONE 4K" class="server-logo">
                <h3>ONE 4K</h3>
                <ul class="pricing-list">
                    <li class="price-item"><span>شهر واحد</span><span>5,000 د.ع</span></li>
                    <li class="price-item"><span>3 أشهر</span><span>10,000 د.ع</span></li>
                </ul>
                <a href="#" onclick="orderServer('ONE 4K')" class="btn-whatsapp">اطلب الآن</a>
            </div>

            <!-- Server 3: Tiger OTT -->
            <div class="server-card">
                <img src="IMG_214040_20260816.jpg" alt="Tiger OTT" class="server-logo">
                <h3>Tiger OTT</h3>
                <ul class="pricing-list">
                    <li class="price-item"><span>شهر واحد</span><span>5,000 د.ع</span></li>
                    <li class="price-item"><span>3 أشهر</span><span>10,000 د.ع</span></li>
                </ul>
                <a href="#" onclick="orderServer('Tiger OTT')" class="btn-whatsapp">اطلب الآن</a>
            </div>

            <!-- Server 4: Plume4k -->
            <div class="server-card">
                <img src="IMG_214107_20260816.jpg" alt="Plume4k" class="server-logo">
                <h3>Plume 4K</h3>
                <ul class="pricing-list">
                    <li class="price-item"><span>6 أشهر</span><span>10,000 د.ع</span></li>
                    <li class="price-item"><span>سنة كاملة</span><span>20,000 د.ع</span></li>
                </ul>
                <a href="#" onclick="orderServer('Plume 4K')" class="btn-whatsapp">اطلب الآن</a>
            </div>
        </div>
    </div>

    <script>
        const whatsappNumber = "9647731354565"; // ضع رقمك هنا
        function orderServer(serverName) {
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent('أريد الاشتراك في سيرفر: ' + serverName)}`, '_blank');
        }
    </script>
</body>
</html>
